version: '3.8'

services:
  websocket-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simple-websocket-server
    restart: unless-stopped
    ports:
      - "3000:3000"   # Express HTTP server
      - "8080:8080"   # WebSocket server
    environment:
      - NODE_ENV=production
      - PORT=3000
      - WS_PORT=8080
    networks:
      - fleetbase
    volumes:
      # Mount logs directory (optional, for log persistence)
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.example.description=Simple WebSocket server with Express API"
      - "com.example.service=websocket-server"

  # Optional: Add a reverse proxy (nginx) for production use
  nginx:
    image: nginx:alpine
    container_name: websocket-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Mount SSL certificates if available
    depends_on:
      - websocket-app
    networks:
      - fleetbase
    profiles:
      - production  # Only start with --profile production

networks:
  fleetbase:
    driver: bridge
    name: fleetbase

volumes:
  app-logs:
    driver: local